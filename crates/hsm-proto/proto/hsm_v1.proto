// hsm-rs daemon ↔ local plugin protocol.
//
// Transport: gRPC over Unix Domain Socket (or TCP for tests + remote
// agents). One bidirectional stream per plugin process — the stream IS
// the session. The plugin's first message must be Hello; the daemon's
// first reply must be Welcome. After that:
//
//   plugin → daemon : ActionStatus events (one per progress / terminal)
//   daemon → plugin : ActionItem dispatches (Archive/Restore/Remove
//                     are work; Cancel is a control signal — the
//                     plugin trips the cookie's CancellationToken
//                     instead of calling Mover)
//
// Connection close (either side) tears down the agent: the daemon
// re-routes any in-flight actions to ArState::Waiting after a grace
// period (M2d.2c).

syntax = "proto3";

package hsm.v1;

// What kind of work an ActionItem represents.
enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_ARCHIVE     = 1;
  ACTION_KIND_RESTORE     = 2;
  ACTION_KIND_REMOVE      = 3;
  ACTION_KIND_CANCEL      = 4;
}

// Backend-side metadata for an archived object. Round-tripped through
// trusted.lhsm_uuid / hash / url xattrs on the Lustre file.
message BackendObject {
  string uuid = 1;
  bytes  hash = 2;     // BLAKE3, 32 bytes
  string url  = 3;
}

// Plugin-side handshake. Sent first on the bidi stream.
message Hello {
  string agent_id     = 1;     // typically hostname:pid
  repeated uint32 archive_ids = 2;
  string version      = 3;     // plugin's own version string
}

// Daemon-side handshake reply.
message Welcome {
  string session_id = 1;       // diagnostic id; not load-bearing
}

// One unit of work. Cancel-kind items have only `cookie` set
// meaningfully (path / extent / data are ignored).
message ActionItem {
  fixed64    cookie       = 1;
  uint32     archive_id   = 2;
  ActionKind kind         = 3;
  string     primary_path = 4;   // file to read (Archive/Remove)
  string     write_path   = 5;   // file to write (Restore)
  uint64     offset       = 6;
  uint64     length       = 7;   // 0xffffffff_ffffffff = whole file
  bytes      data         = 8;   // opaque hai_data hint, untrusted
  optional BackendObject existing = 9; // restore/remove target
  // Lustre FID (seq:oid:ver). Plugins that route by FID (terrasync,
  // anything writing per-FID backend object names) need this.
  fixed64    fid_seq      = 10;
  fixed32    fid_oid      = 11;
  fixed32    fid_ver      = 12;
}

// Plugin → daemon status. `completed=false` is a non-terminal
// progress tick. `completed=true` with `errno=0` is success; non-zero
// `errno` is failure (use 125 for cancellation per Linux ECANCELED).
//
// `bytes_advanced` is *cumulative* — daemon stores it as the
// "furthest byte fully transferred" so out-of-order delivery doesn't
// regress the store invariant.
message ActionStatus {
  fixed64 cookie         = 1;
  uint64  bytes_advanced = 2;
  bool    completed      = 3;
  int32   errno          = 4;
  optional BackendObject result = 5;  // Archive only; xattr write input
}

// Plugin → daemon stream message envelope.
message FromPlugin {
  oneof body {
    Hello        hello  = 1;
    ActionStatus status = 2;
  }
}

// Daemon → plugin stream message envelope.
message ToPlugin {
  oneof body {
    Welcome    welcome = 1;
    ActionItem action  = 2;
  }
}

service DataMover {
  // The single session RPC. Plugin opens one, sends Hello, then
  // streams status events. Daemon accepts, sends Welcome, then streams
  // action items (including Cancel as a control signal).
  //
  // Named `Open` rather than `Connect` because `connect` is already an
  // inherent method on the generated tonic client (used for transport
  // dial-up); having both produces a name collision.
  rpc Open(stream FromPlugin) returns (stream ToPlugin);
}
