[package]
name = "hsm-curvine"
description = "Capability-negotiated Curvine Adapter for the generic HSM Interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:tokio", "dep:clap", "dep:hsm-engine", "dep:curvine-config", "dep:curvine-runtime", "dep:curvine-model","dep:curvine-client-core", "dep:curvine-fs-api", "dep:curvine-proto", "dep:curvine-error", "dep:hsm-local", "dep:tempfile", "dep:blake3"]
native-integration = ["native", "dep:curvine-server"]

[dependencies]
tokio = { workspace = true, features = ["time", "signal", "rt", "macros"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hsm-engine = { path = "../hsm-engine", optional = true }
curvine-model = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }
hsm-core = { path = "../hsm-core" }
serde.workspace = true
serde_json = "1"
hsm-local = { path = "../hsm-local", optional = true }
tempfile = { version = "3", optional = true }
blake3 = { version = "1", optional = true }
curvine-client-core = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }
curvine-fs-api = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }
curvine-proto = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }
curvine-error = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }
# Opt-in real-cluster test harness, not needed by the production native Adapter.
curvine-server = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", features = ["hsm-scale-test"], optional = true }
curvine-config = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }

curvine-runtime = { git = "https://github.com/JayTsu-sh/curvine.git", rev = "826a2ae9be052b2bf86d1a1647551e396adfcc5f", optional = true }

[dev-dependencies]
hsm-engine = { path = "../hsm-engine" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[[bin]]
name = "hsm-curvine"
path = "src/bin/hsm-curvine.rs"
required-features = ["native"]
