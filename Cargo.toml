[workspace]
resolver = "2"
members = [
    "crates/hsm-core",
    "crates/lustre-sys",
    "crates/lustre-hsm-uapi",
    "crates/lustre-llapi",
    "crates/hsm-proto",
    "crates/hsm-store",
    "crates/hsm-scheduler",
    "crates/hsm-plugin-sdk",
    "crates/plugins/noop",
    "crates/hsmd",
]
# spikes/ are throwaway validation projects with their own [workspace] roots.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JayTsu-sh/hsm-rs"
authors = ["jay.xu <jay.xu@lenovonetapp.com>"]

[workspace.dependencies]
# Cross-cutting deps pinned at the workspace level.
bytes = { version = "1", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"

# FFI / proto build-time
bindgen = "0.71"
prost = "0.13"
tonic = "0.12"
tonic-build = "0.12"

# Test deps
hex = "0.4"

[workspace.lints.rust]
# Production crates should mark unsafe explicitly. lustre-sys is exempt
# because bindgen output is inherently unsafe.
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tasteful exemptions to keep noise low while still catching real bugs.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
