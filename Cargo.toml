[workspace]
resolver = "2"
members = ["crates/hsm-core", "crates/hsm-engine", "crates/hsm-local"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/JayTsu-sh/hsm-rs"
authors = ["jay.xu <jay.xu@lenovonetapp.com>"]

[workspace.dependencies]
# Cross-cutting deps pinned at the workspace level.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
# Production crates should mark unsafe explicitly.
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tasteful exemptions to keep noise low while still catching real bugs.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
